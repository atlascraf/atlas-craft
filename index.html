<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atlas Craft — Websites, AI Video &amp; A Brighter Tomorrow</title>
  <meta name="description" content="Atlas Craft is a solo, agent-run studio delivering 3D modeling &amp; rendering, AI-generated ad video, and website design &amp; build — one person, one coherent vision, no agency overhead." />

  <link rel="icon" type="image/jpeg" href="/brand/atlas-craft-icon.jpg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Inter:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />

  <script>
    (function () {
      try {
        var saved = localStorage.getItem('atlas-theme');
        var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      document.documentElement.classList.add('js');
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
